# Render Blueprint for the AgencyFlow API.
# Database: MongoDB Atlas (set MONGO_URI in the Render dashboard).
services:
  - type: web
    name: agencyflow-api
    runtime: node
    region: singapore # closest free region to the Atlas cluster (Mumbai)
    rootDir: server
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false # e.g. https://agencyflow.vercel.app (comma-separate multiple origins)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 7
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
